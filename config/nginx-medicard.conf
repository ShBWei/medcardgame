# ── MediCard 医杀 — Nginx Reverse Proxy + Static Cache ──────────
# Target: Ubuntu 22.04, 2-core 2GB RAM
# Install: sudo apt install nginx-full
# Deploy:  sudo cp nginx-medicard.conf /etc/nginx/sites-available/medicard
#          sudo ln -sf /etc/nginx/sites-available/medicard /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

# ── Rate limit zones (tuned for 2GB server) ─────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

# ── Proxy cache for question bank (shared memory, 32MB = ~800 files) ──
proxy_cache_path /tmp/nginx_medicard_cache levels=1:2 keys_zone=medicard_cache:10m
                 max_size=64m inactive=1h use_temp_path=off;

# ── Upstream backends ───────────────────────────────────────────
# Single-port mode: HTTP + PeerJS share port 8080
upstream medicard_http { server 127.0.0.1:8080; }

# ── WebSocket upgrade mapping ───────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # Document root — nginx serves static files directly, Node handles API only
    root /home/ubuntu/medcardgame;

    # ── SSL (uncomment after certbot) ────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # ── Connection limits (tuned for 2GB) ───────────────────────
    limit_conn connperip 15;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Drop scanners ────────────────────────────────────────────
    if ($http_user_agent ~* (scanner|bot|crawl|spider|zgrab|masscan|nmap|sqlmap|nikto|dirbuster)) {
        return 444;
    }
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 444; }

    # ── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    server_tokens off;

    # ── Gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_proxied any;
    gzip_disable "msie6";

    # Brotli — if ngx_brotli module installed
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Static assets — immutable, long cache ────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── CSS/JS — short cache, directly served ────────────────────
    location ~* \.(css|js)$ {
        expires 2h;
        add_header Cache-Control "public";
        # Serve directly from filesystem — no Node proxy for static content
        try_files $uri =404;
    }

    # ── Question bank files — cache aggressively (rarely change) ─
    location /src/modules/question-bank/subjects/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── HTML — never cache ────────────────────────────────────────
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri /index.html;
    }

    # ── Root ──────────────────────────────────────────────────────
    location = / {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        try_files /index.html =404;
    }

    # ── Block sensitive paths ────────────────────────────────────
    location ~* /\.(git|env|ht|svn|hg)/ { return 404; }
    location ~* /(node_modules|package\.json|package-lock)/ { return 404; }
    location ~* /(tools|production|data)/ { return 404; }
    location ~* \.(phar|php|asp|jsp|cgi|pl|py|rb|sh|bash|sql|db|sqlite)$ { return 404; }

    # ── PeerJS WebSocket proxy (single-port: HTTP + PeerJS on 8080) ──
    location /medicard {
        limit_req zone=ws burst=5 nodelay;
        proxy_pass http://medicard_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API — proxy to Node backend ──────────────────────────────
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://medicard_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_cache medicard_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Fallback — proxy to Node (only for non-static paths) ─────
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://medicard_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
