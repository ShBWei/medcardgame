name: 💡 功能建议
description: 提出新功能或改进建议
title: "[Feature] 简要描述你的建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请描述你想要的特性，我们会认真评估。

  - type: dropdown
    id: type
    attributes:
      label: 建议类型
      options:
        - 新功能模块
        - 现有功能改进
        - UI/UX 优化
        - 性能优化
        - 文档改进
        - 其他
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 卡牌对战 (Battle)
        - 刷题工坊 (Study)
        - 快学模式 (FastLearn)
        - 错题本 (Notebook)
        - 多人联机 (Multiplayer)
        - 用户认证 (Auth)
        - 构建/部署 (Build/Deploy)
        - 不涉及具体模块
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 描述当前体验中让你想要提出改进的具体痛点
      placeholder: "例如：刷题时无法只练习某个章节，每次都要从全部题目中随机"

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 请详细描述你希望的功能如何运作
      placeholder: "例如：在科目选择界面增加章节筛选，勾选后只出该章节的题目"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 如果有其他实现方式也可以写出来

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 任何有助于理解需求的截图、草图、参考链接等
