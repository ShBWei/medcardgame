name: 🐛 Bug 报告
description: 提交一个 bug 报告，帮助我们改进项目
title: "[Bug] 简要描述你遇到的问题"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提交 bug 报告！请尽可能填写以下信息，帮助我们快速定位问题。

  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 你使用的是哪个版本？（可在首页底部查看）
      placeholder: "例如: v6.5.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 使用平台
      options:
        - 桌面浏览器 (Chrome / Edge / Firefox)
        - 手机浏览器 (iOS Safari / Android Chrome)
        - 桌面 PWA
        - 手机 PWA
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: "例如: Chrome 125, Safari 17.4"
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 问题模块
      description: 问题出现在哪个功能模块？
      options:
        - 卡牌对战 (Battle)
        - 刷题工坊 (Study)
        - 快学模式 (FastLearn)
        - 错题本 (Notebook)
        - 多人联机 (Multiplayer)
        - 用户认证 (Auth)
        - 主题/UI (Theme)
        - 构建/部署 (Build/Deploy)
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请详细描述触发 bug 的操作步骤
      placeholder: |
        1. 打开页面 '...'
        2. 点击 '...'
        3. 选择 '...'
        4. 观察到错误 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？（错误信息、截图、控制台日志等）
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 浏览器控制台日志
      description: 打开浏览器开发者工具 (F12) → Console 标签，复制相关错误信息
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何有助于定位问题的补充说明（如网络状态、特殊操作、复现频率等）
